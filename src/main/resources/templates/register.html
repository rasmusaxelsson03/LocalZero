<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LocalZero – Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>🌱 LocalZero</h1>
            <p>Create your account</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Anna Svensson" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="Block C, Malmö" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Roles</label>
                <div class="role-chips">
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                        <input type="checkbox" name="roles" value="RESIDENT" checked style="width:auto;">
                        <span class="badge badge-green">Resident</span>
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                        <input type="checkbox" name="roles" value="ORGANIZER" style="width:auto;">
                        <span class="badge badge-teal">Organizer</span>
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:10px; margin-top:6px;">
                Create account
            </button>
        </form>

        <div class="auth-link">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </div>
    </div>
</div>
</body>
</html>
